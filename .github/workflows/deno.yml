# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# This workflow will install Deno then run `deno lint` and `deno test` on the
# Supabase Edge Functions in supabase/functions, the only part of this repo
# that runs on Deno. The rest is a Vite/React/Node app that Deno's linter was
# never meant to check; linting the whole repo failed on every run because of
# that, not because of real problems.
# For more information see: https://github.com/denoland/setup-deno

name: Deno

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Setup repo
        uses: actions/checkout@v4

      - name: Setup Deno
        # uses: denoland/setup-deno@v1
        uses: denoland/setup-deno@61fe2df320078202e33d7d5ad347e7dcfa0e8f31  # v1.1.2
        with:
          deno-version: v1.x

      # Uncomment this step to verify the use of 'deno fmt' on each commit.
      # - name: Verify formatting
      #   run: deno fmt --check

      - name: Run linter
        run: deno lint supabase/functions

      # There are no edge function tests yet. --permit-no-files keeps this step
      # passing until the first *_test.ts lands, and runs them from then on.
      - name: Run tests
        run: deno test -A --permit-no-files supabase/functions
