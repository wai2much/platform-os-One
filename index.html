<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- SVG first so the mark stays crisp on any density; the PNG is the
         fallback for browsers that don't take SVG icons (older Safari). -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/hos-mark-black.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Platform OS One</title>
    <script>
      // Set the theme before first paint so a dark-mode user never sees a
      // flash of the cream light theme. Mirrors src/core/theme.js — kept
      // inline (and dependency-free) because it has to run before the bundle.
      (function () {
        try {
          var pref = localStorage.getItem('platform-os-theme') || 'system';
          var dark = pref === 'dark' || (pref === 'system'
            && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
